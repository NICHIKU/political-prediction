services:
 traefik:
    image: traefik:latest
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingest:
    image: ghcr.io/nichiku/political-prediction-ingest:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  fastapi:
    image: ghcr.io/nichiku/political-prediction-fastapi:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastapi.rule=Host(`predilapi.164.132.43.197.nip.io`)"
      - "traefik.http.routers.fastapi.entrypoints=web"
      - "traefik.http.services.fastapi.loadbalancer.server.port=8080"
    restart: always

  django:
    image: ghcr.io/nichiku/political-prediction-django:latest
    depends_on:
      - fastapi
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL_LOCAL: http://fastapi:8080
      BASE_URL: https://geo.api.gouv.fr
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`predilection.164.132.43.197.nip.io`)"
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    restart: always

volumes:
  postgres_data:
