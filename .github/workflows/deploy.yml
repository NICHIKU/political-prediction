name: Build & Deploy

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nichiku/political-prediction

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FastAPI
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-fastapi:latest

      - name: Build & push Django
        uses: docker/build-push-action@v5
        with:
          context: ./django_political_app
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-django:latest

      - name: Build & push Ingest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/Dockerfile
          push: true
          tags: ghcr.io/nichiku/political-prediction-ingest:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Debug key length
        run: echo "${{ secrets.VPS_SSH_KEY }}" | wc -c

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy sur le VPS
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            mkdir -p ~/political-prediction && cd ~/political-prediction
            curl -sO https://raw.githubusercontent.com/NICHIKU/political-prediction/develop/docker-compose.yaml
            cat > .env << ENVEOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            SECRET_KEY=${SECRET_KEY}
            DEBUG=${DEBUG}
            ENVEOF
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u nichiku --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
          EOF
