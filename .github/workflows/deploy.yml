name: Build & Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nichiku/political-prediction

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FastAPI
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-fastapi:latest
            ${{ env.IMAGE_PREFIX }}-fastapi:${{ github.event.release.tag_name }}

      - name: Build & push Django
        uses: docker/build-push-action@v5
        with:
          context: ./django_political_app
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-django:latest
            ${{ env.IMAGE_PREFIX }}-django:${{ github.event.release.tag_name }}

      - name: Build & push Ingest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ingest:latest
            ${{ env.IMAGE_PREFIX }}-ingest:${{ github.event.release.tag_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy sur le VPS
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            mkdir -p ~/political-prediction && cd ~/political-prediction
            curl -sO https://raw.githubusercontent.com/NICHIKU/political-prediction/develop/docker-compose.yaml
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}" >> .env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
            echo "DEBUG=${{ secrets.DEBUG }}" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u nichiku --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
          EOF
