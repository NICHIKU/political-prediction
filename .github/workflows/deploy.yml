name: Build & Deploy

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nichiku/political-prediction

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FastAPI
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-fastapi:latest

      - name: Build & push Django
        uses: docker/build-push-action@v5
        with:
          context: ./django_political_app
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-django:latest

  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
  
      steps:
        - name: Deploy sur le VPS
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            port: ${{ secrets.VPS_SSH_PORT }}
            script: |
              mkdir -p ~/political-prediction
              cd ~/political-prediction
  
              curl -sO https://raw.githubusercontent.com/NICHIKU/political-prediction/develop/docker-compose.yaml
  
              cat > .env << EOF
              POSTGRES_USER=${{ secrets.POSTGRES_USER }}
              POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
              POSTGRES_DB=${{ secrets.POSTGRES_DB }}
              DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
              SECRET_KEY=${{ secrets.SECRET_KEY }}
              DEBUG=${{ secrets.DEBUG }}
              EOF
  
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              docker compose pull
              docker compose up -d --remove-orphans
